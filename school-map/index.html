  {"name": "本庄第一", "area": "本庄市", "type": "私立", "sex": "共学", "score": 30, "lat": 36.251111, "lon": 139.21175}
];

const map = L.map('map', {tap: true}).setView([35.75, 139.65], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap contributors'
}).addTo(map);

function color(t) { return t === '男子' ? '#3388ff' : t === '共学' ? '#2ca25f' : '#e34a8a'; }

function radius(s) {
  return 80 + Math.pow(Math.max(0, s - 30), 2) * 0.6;
}

const layer = L.layerGroup().addTo(map);
let selectedSex = 'all';

function draw() {
  layer.clearLayers();
  const min = +document.getElementById('min').value;
  const max = +document.getElementById('max').value;
  schools.forEach(x => {
    if (x.score < min || x.score > max) return;
    if (selectedSex !== 'all' && x.sex !== selectedSex) return;

    const r = radius(x.score);
    const isPublic = ['国立', '都立', '区立', '市立', '県立'].includes(x.type);
    const c = L.circle([x.lat, x.lon], {
      radius: r,
      // 円の塗り色は従来どおり男女区分。国公立だけ円周を黒系＋破線にして区別。
      color: isPublic ? '#555555' : color(x.sex),
      fillColor: color(x.sex),
      fillOpacity: 0.38,
      weight: isPublic ? 2.0 : 1.8,
      dashArray: isPublic ? '4 4' : null
    }).addTo(layer);

    const popupText = `<b>${x.name}</b><br>${x.area}｜${x.type}｜${x.sex}<br><span class="score">偏差値 ${x.score}</span>`;
    c.bindPopup(popupText);
  });
}

document.querySelectorAll('.sexbtn').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.sexbtn').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  selectedSex = b.dataset.sex;
  draw();
}));

function updateRangeUI(){
  const minEl=document.getElementById('min');
  const maxEl=document.getElementById('max');
  const min=+minEl.value, max=+maxEl.value;
  const pctMin=((min-30)/(74-30))*100;
  const pctMax=((max-30)/(74-30))*100;
  document.getElementById('minv').textContent=min;
  document.getElementById('maxv').textContent=max;
  document.getElementById('rangeFill').style.left=pctMin+'%';
  document.getElementById('rangeFill').style.right=(100-pctMax)+'%';
}

document.getElementById('min').addEventListener('input',()=>{
  const minEl=document.getElementById('min'), maxEl=document.getElementById('max');
  if(+minEl.value>+maxEl.value) maxEl.value=minEl.value;
  updateRangeUI(); draw();
});
document.getElementById('max').addEventListener('input',()=>{
  const minEl=document.getElementById('min'), maxEl=document.getElementById('max');
  if(+maxEl.value<+minEl.value) minEl.value=maxEl.value;
  updateRangeUI(); draw();
});
updateRangeUI();

const legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  const d = L.DomUtil.create('div', 'map-legend');
  d.innerHTML = '<b>区分</b><br><i style="background:#3388ff"></i>男子校<br><i style="background:#2ca25f"></i>共学<br><i style="background:#e34a8a"></i>女子校<br><span style="display:inline-block;width:22px;border-top:2px dashed #555;margin:0 5px 3px 0;"></span>国公立';
  return d;
};
legend.addTo(map);

draw();
</script>
</body>
</html>
